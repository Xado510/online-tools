<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京东拆包系统</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --surface-2: #f8fafb;
    --text: #1f2329;
    --text-2: #5a6472;
    --text-3: #96a0ad;
    --border: #e3e7ec;
    --red: #e1251b;
    --red-dark: #c8161d;
    --red-light: #fff1f0;
    --green: #17884c;
    --green-light: #e7f6ee;
    --blue: #2563eb;
    --blue-light: #eaf1ff;
    --amber: #b45309;
    --amber-light: #fef3e2;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-md: 0 4px 14px rgba(16, 24, 40, .07);
    --radius: 8px;
  }
  html { height: 100%; }
  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  body::after {
    content: "客户为先 · 创新 · 拼搏 · 担当 · 感恩 · 诚信";
    position: fixed;
    left: 0;
    right: 0;
    bottom: 6px;
    z-index: 1;
    text-align: center;
    font-size: 13px;
    letter-spacing: .28em;
    color: rgba(31, 35, 41, .12);
    pointer-events: none;
    white-space: nowrap;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  .login-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
      radial-gradient(circle at 20% 18%, rgba(225, 37, 27, .08), transparent 32%),
      linear-gradient(145deg, #f7f8fa 0%, #ffffff 56%, #f1f3f6 100%);
  }
  .login-overlay.hidden { display: none; }
  .auth-locked .layout { display: none; }
  .login-card {
    width: 100%;
    max-width: 420px;
    padding: 24px 30px 30px;
    background: rgba(255, 255, 255, .92);
    border: 1px solid rgba(227, 231, 236, .9);
    border-radius: var(--radius);
    box-shadow: 0 18px 48px rgba(16, 24, 40, .10);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .login-mascot {
    width: 170px;
    height: 126px;
    margin: -6px auto 6px;
    position: relative;
  }
  .login-mascot svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
    animation: mascotFloat 3.6s ease-in-out infinite;
  }
  .mascot-shadow {
    width: 86px;
    height: 14px;
    margin: 0 auto;
    border-radius: 50%;
    background: rgba(31, 35, 41, .10);
    filter: blur(3px);
    animation: mascotShadow 3.6s ease-in-out infinite;
  }
  .mascot-eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: mascotBlink 5.2s ease-in-out infinite;
  }
  @keyframes mascotFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  @keyframes mascotShadow {
    0%, 100% { transform: scaleX(1); opacity: .75; }
    50% { transform: scaleX(.82); opacity: .45; }
  }
  @keyframes mascotBlink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(.08); }
  }
  .login-brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 4px 0 20px; }
  .login-title { font-size: 19px; font-weight: 800; }
  .login-sub { margin-top: 2px; font-size: 12px; color: var(--text-3); }
  .login-field { margin-top: 14px; }
  .login-field label { display: block; margin-bottom: 6px; color: var(--text-2); font-size: 12px; font-weight: 600; }
  .login-field input {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    outline: none;
  }
  .login-field input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(225, 37, 27, .08); }
  .login-error { min-height: 20px; margin-top: 8px; color: var(--red); font-size: 12px; }
  .login-card .btn { width: 100%; margin-top: 4px; }
  .disclaimer-btn {
    position: fixed;
    left: 14px;
    bottom: 14px;
    z-index: 60;
    height: 30px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: rgba(255, 255, 255, .88);
    color: var(--text-3);
    font-size: 12px;
    box-shadow: var(--shadow-sm);
  }
  .disclaimer-btn:hover { color: var(--text); background: var(--surface); }
  .disclaimer-content { line-height: 1.8; color: var(--text-2); font-size: 13px; }
  .disclaimer-content h3 { margin: 14px 0 6px; font-size: 14px; color: var(--text); }
  .disclaimer-content h3:first-child { margin-top: 0; }

  .layout { display: flex; min-height: 100vh; }

  .sidebar {
    width: 232px;
    flex: 0 0 232px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 14px 12px 16px;
    z-index: 50;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 18px; border-bottom: 1px solid var(--border); }
  .brand-mark {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: var(--red);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: .02em;
  }
  .brand-text { display: flex; flex-direction: column; min-width: 0; }
  .brand-text strong { font-size: 15px; font-weight: 800; }
  .brand-text span { font-size: 11px; color: var(--text-3); letter-spacing: .08em; }

  .nav { display: flex; flex-direction: column; gap: 4px; padding: 16px 0; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 0;
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-2);
    font-weight: 600;
    text-align: left;
    transition: background .18s ease, color .18s ease;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--red-light); color: var(--red); }
  .nav-item svg { width: 18px; height: 18px; }

  .main { flex: 1; min-width: 0; }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 24px 14px;
    background: rgba(255, 255, 255, .92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .title-wrap h1 { font-size: 20px; line-height: 1.3; }
  .title-wrap p { margin-top: 2px; font-size: 12px; color: var(--text-3); }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .warehouse-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text-2);
    font-size: 13px;
    white-space: nowrap;
  }
  .warehouse-chip svg { width: 16px; height: 16px; color: var(--red); }
  .user-badge {
    min-width: 34px;
    height: 34px;
    padding: 0 9px;
    border-radius: 999px;
    background: var(--red);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: .02em;
  }
  .top-robot {
    width: 30px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .top-robot svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .user-badge.top-user-badge {
    min-width: 36px;
    height: 36px;
    width: 36px;
    padding: 3px;
    border-radius: 50%;
    background: #fff1f0;
    border: 1px solid #f4c7c4;
  }

  .content { max-width: 1440px; margin: 0 auto; padding: 20px 24px 48px; }
  .view { display: none; }
  .view.active { display: block; animation: viewIn .25s ease; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .btn {
    height: 38px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    white-space: nowrap;
    transition: border-color .18s ease, background .18s ease, transform .12s ease;
  }
  .btn:hover { border-color: #c7cdd5; background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--red); border-color: var(--red); color: #fff; }
  .btn-primary:hover { background: var(--red-dark); border-color: var(--red-dark); }
  .btn-danger { background: var(--red-light); border-color: #f4c7c4; color: var(--red); }
  .btn-danger:hover { background: #ffe4e2; }
  .icon-btn {
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn svg { width: 18px; height: 18px; }
  .link-btn { border: 0; background: transparent; color: var(--blue); font-weight: 600; padding: 0; }
  .link-btn:hover { text-decoration: underline; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
  }
  .panel-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .panel-title { font-size: 15px; font-weight: 800; }
  .panel-sub { margin-top: 3px; font-size: 12px; color: var(--text-3); }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 14px;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow-sm);
    min-width: 0;
  }
  .stat-icon {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stat-icon svg { width: 20px; height: 20px; }
  .stat-icon.red { background: var(--red-light); color: var(--red); }
  .stat-icon.blue { background: var(--blue-light); color: var(--blue); }
  .stat-icon.amber { background: var(--amber-light); color: var(--amber); }
  .stat-icon.green { background: var(--green-light); color: var(--green); }
  .stat-copy { min-width: 0; }
  .stat-label { font-size: 12px; color: var(--text-2); }
  .stat-value { margin-top: 2px; font-size: 22px; line-height: 1.2; font-weight: 800; white-space: nowrap; }
  .stat-delta { margin-top: 2px; font-size: 11px; color: var(--text-3); white-space: nowrap; }
  .stat-delta.up { color: var(--green); }
  .stat-delta.down { color: var(--red); }

  .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, .8fr); gap: 14px; margin-bottom: 14px; }
  .goal-text { font-size: 12px; color: var(--text-2); font-weight: 700; }
  .goal-track { height: 10px; border-radius: 999px; background: #eef1f4; overflow: hidden; }
  .goal-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--red), #f97316); transition: width .5s ease; }
  .chart { display: flex; align-items: flex-end; gap: 8px; height: 132px; margin-top: 16px; }
  .chart-col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 7px; }
  .bar-fill {
    width: 100%;
    max-width: 30px;
    min-height: 4px;
    border-radius: 4px 4px 0 0;
    background: linear-gradient(180deg, var(--red), #fca5a5);
    transition: height .45s ease;
  }
  .bar-value { font-size: 11px; font-weight: 700; color: var(--text-2); }
  .bar-label { font-size: 10px; color: var(--text-3); }

  .category-chart {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    height: 220px;
    margin-top: 16px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .category-col {
    flex: 1 0 72px;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 7px;
  }
  .category-count { font-size: 12px; font-weight: 800; color: var(--red); }
  .category-bar {
    width: 100%;
    max-width: 44px;
    min-height: 4px;
    border-radius: 6px 6px 0 0;
    background: linear-gradient(180deg, var(--red), #fca5a5);
  }
  .category-label {
    max-width: 70px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 800;
    color: var(--text-2);
  }

  .anomaly-list { display: flex; flex-direction: column; gap: 10px; }
  .anomaly-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-2);
  }
  .anomaly-item svg { width: 17px; height: 17px; flex: 0 0 17px; margin-top: 1px; color: var(--amber); }
  .anomaly-item strong { display: block; font-size: 13px; }
  .anomaly-item p { margin-top: 2px; color: var(--text-2); font-size: 12px; line-height: 1.45; }
  .anomaly-item .status { margin-top: 8px; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status-done { background: var(--green-light); color: var(--green); }
  .status-pending { background: var(--amber-light); color: var(--amber); }
  .status-unpacking { background: var(--blue-light); color: var(--blue); }
  .status-anomaly { background: var(--red-light); color: var(--red); }
  .status-resolved { background: var(--blue-light); color: var(--blue); }

  .table-wrap { overflow-x: auto; }
  #parcelTableWrap {
    max-height: calc(100vh - 300px);
    min-height: 220px;
    overflow-y: auto;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  #parcelTableWrap thead th {
    position: sticky;
    top: 0;
    z-index: 2;
  }
  table { width: 100%; border-collapse: collapse; min-width: 760px; }
  th {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-2);
    font-size: 12px;
    font-weight: 700;
    text-align: left;
    white-space: nowrap;
  }
  td { padding: 12px; border-bottom: 1px solid #eef1f4; vertical-align: middle; font-size: 13px; }
  tr:last-child td { border-bottom: 0; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #fafbfc; }
  .parcel-main { min-width: 0; }
  .parcel-main strong { display: block; font-weight: 700; line-height: 1.35; }
  .parcel-main span { display: block; margin-top: 2px; color: var(--text-3); font-size: 12px; }
  .mini-btn {
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text-2);
    font-weight: 600;
    font-size: 12px;
  }
  .mini-btn:hover { border-color: var(--red); color: var(--red); }
  .mini-btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .mini-btn.primary:hover { background: var(--red-dark); }
  .empty-row td { padding: 36px 16px; text-align: center; color: var(--text-3); }

  .scan-head { margin-bottom: 14px; }
  .scan-search { display: flex; gap: 10px; flex-wrap: wrap; }
  .search-input {
    flex: 1 1 320px;
    min-width: 260px;
    height: 44px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    outline: none;
    font-size: 15px;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .search-input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(225, 37, 27, .12); }
  .scan-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .sample-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .sample-label { font-size: 12px; color: var(--text-3); }
  .sample-chip {
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-2);
    font-size: 12px;
  }
  .sample-chip:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }

  .scan-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(300px, .75fr); gap: 14px; }
  .scan-empty {
    min-height: 360px;
    border: 1px dashed #cfd5dc;
    border-radius: var(--radius);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  .empty-state { text-align: center; color: var(--text-3); max-width: 280px; }
  .empty-state > svg { width: 52px; height: 52px; color: #cbd2da; }
  .empty-state h3 { margin-top: 14px; font-size: 16px; color: var(--text-2); }
  .empty-state p { margin-top: 6px; font-size: 13px; line-height: 1.6; }

  .package-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .meta-item {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-2);
    padding: 10px 12px;
    min-width: 0;
  }
  .meta-item span { display: block; font-size: 11px; color: var(--text-3); }
  .meta-item strong { display: block; margin-top: 3px; font-size: 14px; line-height: 1.4; word-break: break-word; }
  .section-label { margin: 18px 0 10px; font-size: 13px; font-weight: 800; color: var(--text-2); }
  .product-list { display: flex; flex-direction: column; gap: 9px; }
  .product-item {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-2);
    padding: 10px 12px;
    cursor: pointer;
  }
  .product-item:hover { border-color: #c9cfd6; }
  .product-item input[type="checkbox"] { width: 18px; height: 18px; flex: 0 0 18px; accent-color: var(--red); }
  .product-icon {
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    border-radius: var(--radius);
    background: #fff;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--red);
  }
  .product-icon svg { width: 17px; height: 17px; }
  .product-info { flex: 1; min-width: 0; }
  .product-info strong { display: block; font-size: 13px; line-height: 1.4; }
  .product-info span { display: block; margin-top: 2px; font-size: 12px; color: var(--text-3); }
  .quantity { font-weight: 800; color: var(--red); white-space: nowrap; }

  .field-label { display: block; margin: 16px 0 8px; font-size: 13px; font-weight: 700; color: var(--text-2); }
  .condition-group { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .condition-option { position: relative; }
  .condition-option input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .condition-option span {
    height: 74px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-2);
    text-align: center;
    transition: border-color .18s ease, background .18s ease, color .18s ease;
  }
  .condition-option input:checked + span { border-color: var(--red); background: var(--red-light); color: var(--red); }
  .condition-option input:focus-visible + span { box-shadow: 0 0 0 3px rgba(225, 37, 27, .16); }
  .condition-option strong { font-size: 13px; }

  }

  function ago(minutes) {
    const d = new Date();
    d.setMinutes(d.getMinutes() - minutes);
    return d.toISOString();
  }

  function makeId(prefix, index) {

  function seedState() {
    return {
      settings: { goal: 120, operator: 'admin', station: '3号拆包台' },
      parcels: [],
      anomalies: []
    };
  }

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        parsed.parcels = mergeParcelList([], parsed.parcels || []);
        return parsed;
      }
    } catch (err) {
      console.warn(err);
    }
    return seedState();
  }

  function saveState() {
    saveLocalState();
    pushStateToServer();
  }

  function saveLocalState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      console.warn(err);
    }
  }

  function stateTime(item) {
    return String((item && (item.updatedAt || item.unpackedAt || item.createdAt)) || '');
  }

  function collectParcelCodes(item) {
    const jd = (item && item.jdRepair) || {};
    return [
      item && item.tracking,
      item && item.order,
      item && item.performingOrderNo,
      jd.performingOrderNo,
      jd.expressNo,
      jd.serviceOrderNo,
      jd.merchantOrderNo
    ].map((value) => String(value || '').trim().toUpperCase()).filter(Boolean);
  }

  function parcelMatches(a, b) {
    if (!a || !b) return false;
    const codes = new Set(collectParcelCodes(a));
    return collectParcelCodes(b).some((code) => codes.has(code));
  }

  function mergeParcelList(localList, remoteList) {
    const combined = [];
    [...(localList || []), ...(remoteList || [])].forEach((item) => {
      if (!item || !item.id) return;
      const index = combined.findIndex((existing) => parcelMatches(existing, item));
      if (index < 0) {
        combined.push(item);
        return;
      }
      const existing = combined[index];
      const existingClosed = existing.status === 'done' || existing.status === 'anomaly';
      const itemClosed = item.status === 'done' || item.status === 'anomaly';
      if (itemClosed && !existingClosed) {
        combined[index] = item;
      } else if (stateTime(item) >= stateTime(existing)) {
        combined[index] = item;
      }
    });
    return combined;
  }

  function mergeStateList(localList, remoteList) {
    const combined = {};
    [...(localList || []), ...(remoteList || [])].forEach((item) => {
      if (!item || !item.id) return;
      const key = String(item.id);
      if (!combined[key] || stateTime(item) >= stateTime(combined[key])) {
        combined[key] = item;
      }
    });
    return Object.values(combined);
  }

  function mergeSharedState(local, remote) {
    return {
      settings: local.settings || { goal: 120, operator: 'admin', station: '3号拆包台' },
      parcels: mergeParcelList(local.parcels, remote.parcels),
      anomalies: mergeStateList(local.anomalies, remote.anomalies)
    };
  }

  async function pushStateToServer(replace = false) {
    try {
      const clearedAt = replace ? new Date().toISOString() : undefined;
      if (clearedAt) localStorage.setItem(LAST_CLEARED_KEY, clearedAt);
      await fetch(apiUrl('/api/state'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          account: AUTH_USER,
          replace,
          clearedAt,
          state: { parcels: state.parcels || [], anomalies: state.anomalies || [] }
        })
      });
    } catch (err) {
      // 本地仍可作业，联网后再次同步。
    }
  }

  async function refreshSharedState() {
    try {
      const response = await fetch(apiUrl(`/api/state?account=${encodeURIComponent(AUTH_USER)}`));
      const data = await response.json();
      const remote = (data && data.state) || { parcels: [], anomalies: [] };
      const remoteClearedAt = remote.clearedAt || '';
      const lastClearedAt = localStorage.getItem(LAST_CLEARED_KEY) || '';
      if (remoteClearedAt && (!lastClearedAt || remoteClearedAt >= lastClearedAt)) {
        state = mergeSharedState(seedState(), remote);
        localStorage.setItem(LAST_CLEARED_KEY, remoteClearedAt);
      } else {
        state = mergeSharedState(state, remote);
      }
      saveLocalState();
      pushStateToServer(false);
      renderAll();
    } catch (err) {
      // 未连接后端时继续使用本地数据。
    }
  }

  function applyAuthGate() {
    localStorage.removeItem('jd_api_base');
    const hasConfig = Boolean(
      localStorage.getItem('jd_cookie') ||
      localStorage.getItem('jd_jdl_cookie') ||
      localStorage.getItem('jd_jdl_token')
    );
    const authed = localStorage.getItem(AUTH_KEY) === '1' ||
      (hasConfig && localStorage.getItem('jd_logged_out') !== '1');
    document.body.classList.toggle('auth-locked', !authed);
    document.getElementById('loginOverlay').classList.toggle('hidden', authed);
    return authed;
  }

  function logout() {
    localStorage.removeItem(AUTH_KEY);
    localStorage.setItem('jd_logged_out', '1');
    applyAuthGate();
  }

  function icon(name) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatTime(iso) {
    if (!iso) return '--';
    const d = new Date(iso);
    return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function formatDuration(seconds) {
    if (!seconds) return '--';
    return `${Math.floor(seconds / 60)}分${pad(seconds % 60)}秒`;
  }

  function isSameDay(iso, now = new Date()) {
    if (!iso) return false;
    const d = new Date(iso);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  }

  function statusBadge(status) {
    const labels = {
      done: '已完成',
      pending: '待拆包',
      unpacking: '拆包中',
      anomaly: '异常'
    };
    return `<span class="status status-${status}">${labels[status] || status}</span>`;
  }

  function formatPerformingModel(value) {
    const map = {
      '01': '维修',
      REPAIR: '维修',
      '02': '换新',
      CHANGE_NEW: '换新',
      '05': '补贴',
      SUBSIDY: '补贴',
      '08': '退货',
      SALES_RETURN: '退货',
      '10': '增值服务',
      ADD_VALUE: '增值服务',
      '11': '服务中台',
      SERVICE_PLATFORM_THIRD_PART_RIGHT: '服务中台'
    };
    return value && map[value] ? map[value] : (value || '--');
  }

  function cleanMeta(value) {
    const text = String(value || '').trim();
    if (!text || text === '--' || ['待核对商品', '待扫描', '综合', '京东自营', '标准纸箱'].includes(text)) return '--';
    return text;

  function renderScan() {

      work.classList.add('hidden');

    const jd = jdRepairResult && jdRepairResult.ok && jdRepairResult.found
      ? jdRepairResult
      : (p.jdRepair && p.jdRepair.ok && p.jdRepair.found ? p.jdRepair : null);
    const polling = jd && jd.barcodePolling && jd.barcodePolling.max ? jd.barcodePolling : null;
    const statusLine = polling
      ? `备件条码循环查询中 ${polling.attempts}/${polling.max}`

  function applyJdRepairData(data, code, seq) {
    if (seq !== jdQuerySeq) return;
    jdRepairResult = data;
    if (data && data.ok && data.found && currentScan && currentScan.tracking.toUpperCase() === code.toUpperCase()) {
      const commit = (data.detail && data.detail.repairCommitInfoDto) || {};
      Object.assign(currentScan, {
        tracking: currentScan.isPerformingQuery ? currentScan.tracking : (data.expressNo || currentScan.tracking),
        product: data.productName || commit.outerMainSkuName || commit.outerSkuName || currentScan.product,
        sku: data.sku || commit.outerSku || currentScan.sku,
        category: data.category || currentScan.category,
        order: data.performingOrderNo || currentScan.order,
        supplier: data.shopName || currentScan.supplier,
        performingModel: data.performingModel || currentScan.performingModel || '--',
        partBarcode: data.partBarcode || currentScan.partBarcode || '',
        jdRepair: data
      });
      currentScan.updatedAt = new Date().toISOString();
      if (currentScan.__index >= 0) {
        state.parcels[currentScan.__index] = { ...currentScan, __index: undefined };
      } else {
        const saved = { ...currentScan };
        delete saved.__index;
        const duplicateIndex = state.parcels.findIndex((p) => parcelMatches(p, saved));
        if (duplicateIndex >= 0) {
          const existing = state.parcels[duplicateIndex];
          saved.id = existing.id;
          saved.createdAt = existing.createdAt || saved.createdAt;
          if (existing.status === 'done' || existing.status === 'anomaly') {
            saved.status = existing.status;
            saved.unpackedAt = existing.unpackedAt || saved.unpackedAt;
            saved.duration = existing.duration || saved.duration;
            saved.note = existing.note || saved.note;
            saved.condition = existing.condition || saved.condition;
          }
          state.parcels[duplicateIndex] = saved;
          currentScan.__index = duplicateIndex;
          currentScan.id = existing.id;
        } else {
          state.parcels.push(saved);
          currentScan.__index = state.parcels.length - 1;
        }
      }
      saveState();
      renderParcels();
    }
    renderScan();
    const lookupKey = (data && (data.performingOrderNo || data.merchantOrderNo || data.serviceBillNo || data.afsServiceBillNo || data.serviceOrderNo)) || '';
    if (data && data.ok && data.found && !data.partBarcode && lookupKey) {
      startPartBarcodePolling(lookupKey, code, seq);
    } else if (data && data.ok && data.found && !data.partBarcode && !lookupKey) {
      toast('未获取到履约单号，无法查询备件条码', 'error');
      maybeRegisterAutoAnomaly(data);
    }
    if (data && data.ok && data.found && data.startSuccess === false) {
      maybeRegisterAutoAnomaly(data);
    }
  }

  function startPartBarcodePolling(merchantOrderNo, code, seq) {
    if (!merchantOrderNo || seq !== jdQuerySeq) return;
    clearTimeout(jdPartBarcodeTimer);
    const jdlToken = localStorage.getItem('jd_jdl_token') || '';
    const jdlCookie = localStorage.getItem('jd_jdl_cookie') || '';
    if (!jdlToken && !jdlCookie) {
      if (jdRepairResult) jdRepairResult.barcodePolling = null;
      maybeRegisterAutoAnomaly({ ...(jdRepairResult || {}), tracking: code, partBarcode: '' });
      toast('未配置展翅 Token/Cookie，已挂入异常处理', 'error');
      return;
    }
    let attempts = 0;
    if (jdRepairResult) jdRepairResult.barcodePolling = { attempts: 0, max: PART_BARCODE_MAX_ATTEMPTS };
    renderScan();
    const run = async () => {
      if (seq !== jdQuerySeq) return;
      attempts += 1;
      if (jdRepairResult) jdRepairResult.barcodePolling = { attempts, max: PART_BARCODE_MAX_ATTEMPTS };
      renderScan();
      toast(`正在循环查询备件条码 ${attempts}/${PART_BARCODE_MAX_ATTEMPTS}`, '');
      const found = await fetchPartBarcode(merchantOrderNo, code, seq);
      if (seq !== jdQuerySeq) return;
      if (found) {
        if (jdRepairResult) jdRepairResult.barcodePolling = null;
        toast('已查询到备件条码并同步', 'success');
        return;
      }
      if (attempts >= PART_BARCODE_MAX_ATTEMPTS) {
        if (jdRepairResult) jdRepairResult.barcodePolling = null;
        maybeRegisterAutoAnomaly({ ...(jdRepairResult || {}), tracking: code, partBarcode: '' });
        toast(`已循环 ${PART_BARCODE_MAX_ATTEMPTS} 次仍未查询到备件条码，已挂入异常处理`, 'error');
        return;
      }
      jdPartBarcodeTimer = setTimeout(run, PART_BARCODE_INTERVAL_MS);
    };
    run();
  }

  async function fetchPartBarcode(merchantOrderNo, code, seq) {
    const jdlToken = localStorage.getItem('jd_jdl_token') || '';
    const jdlCookie = localStorage.getItem('jd_jdl_cookie') || '';
    if (!jdlToken && !jdlCookie) {
      return false;
    }
    try {
      const response = await fetch(apiUrl('/api/repair/part-barcode'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ merchantOrderNo, jdlToken, jdlCookie, clientId: getClientId() })
      });
      const data = await response.json();
      if (seq !== jdQuerySeq || !data || !data.ok) return false;
      if (!data.partBarcode) {
        return false;
      }
      if (jdRepairResult) jdRepairResult.partBarcode = data.partBarcode;
      if (currentScan && currentScan.tracking.toUpperCase() === code.toUpperCase()) {
        currentScan.partBarcode = data.partBarcode;
        if (currentScan.jdRepair) currentScan.jdRepair.partBarcode = data.partBarcode;
        if (currentScan.jdRepair) currentScan.jdRepair.barcodePolling = null;
        if (currentScan.__index >= 0) {
          state.parcels[currentScan.__index] = { ...currentScan, __index: undefined };
          saveState();
          renderParcels();
        }
      }
      renderScan();
      return true;
    } catch (error) {
      return false;
    }
  }

  function maybeRegisterAutoAnomaly(data) {
    if (!data || !data.tracking) return false;
    const tracking = String(data.tracking).trim();
    if (!tracking) return false;

    const missingBarcode = !data.partBarcode;
    const startFailed = data.startSuccess === false && !data.encryptionRequired;
    if (!missingBarcode && !startFailed) return false;

    const reasons = [];
    const startStep = Array.isArray(data.steps) ? data.steps.find((s) => s.name === 'start') : null;
    const startError = String((startStep && startStep.error) || data.error || '').toLowerCase();
    const stateText = String(data.detail && data.detail.repairCommitInfoDto && data.detail.repairCommitInfoDto.serviceState || '').toLowerCase();
    const waiting = startFailed && (
      startError.includes('待接单') ||
      startError.includes('待收货') ||
      startError.includes('待收件') ||
      stateText.includes('wait_arrive') ||
      stateText.includes('wait_receive') ||
      stateText.includes('receive')
    );
    if (missingBarcode) reasons.push('备件条码未生成');
    if (waiting) reasons.push('确认接机按钮仍处于待接单状态');
    else if (startFailed) reasons.push('确认接机/开始接机未完成');

    const type = missingBarcode ? '备件条码缺失' : '待接单';
    const existing = state.anomalies.some(
      (a) =>
        a.tracking === tracking &&
        a.type === type &&
        a.status === 'pending'
    );
    if (existing) return false;

    state.anomalies.push({
      id: `AX${dateNum()}${Date.now().toString().slice(-4)}`,
      parcelId: currentScan && currentScan.tracking === tracking ? currentScan.id : '',
      tracking,
      orderNo: data.performingOrderNo || data.merchantOrderNo || data.serviceOrderNo || '',
      type,
      severity: '高',
      status: 'pending',
      description: reasons.join('，'),
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      handler: state.settings.operator,
      resolvedAt: null
    });
    saveState();
    renderAnomalies();
    toast(`已挂入异常处理：${tracking}`, 'error');
    return true;
  }

  function startJdPolling(code, seq) {
    clearInterval(jdPollTimer);
    let attempts = 0;
    jdPollTimer = setInterval(async () => {
      attempts += 1;
      if (seq !== jdQuerySeq || attempts > 60) {
        clearInterval(jdPollTimer);
        return;
      }
      try {
        const response = await fetch(apiUrl(`/api/repair/latest?tracking=${encodeURIComponent(code)}`));
        const data = await response.json();
        if (seq !== jdQuerySeq) {
          clearInterval(jdPollTimer);
          return;
        }
        if (data && data.ok && data.found) {
          clearInterval(jdPollTimer);
          applyJdRepairData(data, code, seq);
        }
      } catch (error) {
        // The local bridge may not be ready yet; keep polling.
      }
    }, 1500);
  }

    const appCode = localStorage.getItem('jd_appCode') || '';
    const shopCode = localStorage.getItem('jd_shopCode') || '';

      });

      }

  function normalizeScanCode(value) {
    let code = String(value || '').trim().toUpperCase().replace(/[\s\r\n\t]+/g, '');
    const first = code.split(/[-_]/)[0].trim();
    return /^[A-Z0-9]{6,}$/.test(first) ? first : code;
  }

  function isPerformingCode(value) {
    const code = String(value || '').trim().toUpperCase();
    return /^\d+$/.test(code) || (code.startsWith('JD') && !code.startsWith('JDX') && /^\d+$/.test(code.slice(2)));
  }

  function lookupTracking(code) {
    const normalized = normalizeScanCode(code);
    if (!normalized) {
      toast('请输入或扫描快递单号/履约单号', 'error');
      return;
    }
    const input = document.getElementById('trackingInput');
    if (input) input.value = normalized;
    const performingInput = isPerformingCode(normalized);
    if (localStorage.getItem('jd_auto_start') !== '0') {
      queryJdRepairAutoStart(normalized);
    } else {
      queryJdRepair(normalized);
    }

    const matchesParcelCode = (p) => [
      p.tracking,
      p.order,
      p.jdRepair && p.jdRepair.performingOrderNo,
      p.jdRepair && p.jdRepair.merchantOrderNo,
      p.jdRepair && p.jdRepair.serviceOrderNo,
      p.jdRepair && p.jdRepair.expressNo
    ].some((value) => String(value || '').toUpperCase() === normalized);
    const existingIndex = state.parcels.findIndex(matchesParcelCode);
    if (existingIndex >= 0) {
      const existing = state.parcels[existingIndex];
      if (existing.status === 'done' || existing.status === 'anomaly') {
        currentScan = null;
        renderScan();
        openParcelDetail(existing.id);
        toast('该包裹已处理，可查看详情');
        return;
      }
      currentScan = { ...existing, __index: existingIndex, isPerformingQuery: performingInput };
      renderScan();
      return;
    }

    const demo = DEMO_PACKAGES.find((p) => p.tracking.toUpperCase() === normalized || String(p.order || '').toUpperCase() === normalized);
    const nowIso = new Date().toISOString();
    currentScan = {
      ...(demo || {
        tracking: normalized,
        order: '--',
        product: '--',
        sku: '--',
        category: '--',
        quantity: 1,
        supplier: '--',
        box: '--',
        weight: '--'
      }),
      id: `JD${dateNum()}${Date.now().toString().slice(-5)}`,
      status: 'pending',
      operator: state.settings.operator,
      station: state.settings.station,
      createdAt: nowIso,
      unpackedAt: null,
      condition: '完好',
      note: '',
      duration: 0,
      isPerformingQuery: performingInput,
      __index: -1
    };
    if (!demo) toast('未匹配到预置商品，按待核对处理', 'error');
    renderScan();
  }

  function simulateScan() {
    const doneTracking = new Set(state.parcels.filter((p) => p.status === 'done' || p.status === 'anomaly').map((p) => p.tracking.toLowerCase()));
    const candidates = DEMO_PACKAGES.filter((p) => !doneTracking.has(p.tracking.toLowerCase()));
    const demo = candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : DEMO_PACKAGES[Math.floor(Math.random() * DEMO_PACKAGES.length)];
    document.getElementById('trackingInput').value = demo.tracking;
    lookupTracking(demo.tracking);
  }

  function buildParcelFromScan(forcedAnomaly = false) {
    const checks = document.querySelectorAll('.item-check');
    const checkedCount = Array.from(checks).filter((node) => node.checked).length;
    const condition = document.querySelector('input[name="condition"]:checked')?.value || '完好';
    const note = document.getElementById('scanNote').value.trim();
    const missingCount = currentScan.quantity - checkedCount;
    const hasAnomaly = forcedAnomaly || missingCount > 0 || condition === '破损';
    const duration = hasAnomaly ? Math.round(180 + Math.random() * 180) : Math.round(120 + Math.random() * 240);
    const nowIso = new Date().toISOString();

    const parcel = {
      id: currentScan.id,
      tracking: currentScan.tracking,
      order: currentScan.order,
      product: currentScan.product,
      sku: currentScan.sku,
      category: currentScan.category,
      quantity: currentScan.quantity,
      supplier: currentScan.supplier,
      box: currentScan.box,
      weight: currentScan.weight,
      performingModel: currentScan.performingModel || null,
      partBarcode: currentScan.partBarcode || null,
      jdRepair: currentScan.jdRepair || null,
      isPerformingQuery: currentScan.isPerformingQuery || false,
      status: hasAnomaly ? 'anomaly' : 'done',
      operator: state.settings.operator,
      station: state.settings.station,
      condition,
      note,
      duration,
      createdAt: currentScan.createdAt || nowIso,
      updatedAt: nowIso,
      unpackedAt: nowIso
    };

    if (hasAnomaly) {
      const type = forcedAnomaly ? '商品异常' : missingCount > 0 ? '商品少件' : '外包装破损';
      state.anomalies.push({
        id: `AX${dateNum()}${Date.now().toString().slice(-4)}`,
        parcelId: parcel.id,
        tracking: parcel.tracking,
        orderNo: parcel.order || currentScan.order || '',
        type,
        severity: condition === '破损' ? '高' : missingCount > 0 ? '高' : '中',
        status: 'pending',
        description: note || (missingCount > 0 ? `应到 ${currentScan.quantity} 件，实到 ${checkedCount} 件` : `外包装${condition}`),
        createdAt: nowIso,
        updatedAt: nowIso,
        handler: state.settings.operator,
        resolvedAt: null
      });
    }

    if (currentScan.__index >= 0) {
      state.parcels[currentScan.__index] = { ...parcel, __index: undefined };
    } else {
      delete parcel.__index;
      const duplicateIndex = state.parcels.findIndex((p) => parcelMatches(p, parcel));
      if (duplicateIndex >= 0) {
        const existing = state.parcels[duplicateIndex];
        parcel.id = existing.id;
        parcel.createdAt = existing.createdAt || parcel.createdAt;
        state.parcels[duplicateIndex] = parcel;
      } else {
        state.parcels.push(parcel);
      }
    }
    return { parcel, hasAnomaly };
  }

  function confirmUnpack(forcedAnomaly = false) {
    if (!currentScan) {
      toast('请先查询或扫描包裹', 'error');
      return;
    }
    if (currentScan.__index >= 0 && (state.parcels[currentScan.__index].status === 'done' || state.parcels[currentScan.__index].status === 'anomaly')) {
      toast('该包裹已完成处理', 'error');
      return;
    }
    const { parcel, hasAnomaly } = buildParcelFromScan(forcedAnomaly);
    saveState();
    currentScan = null;
    document.getElementById('trackingInput').value = '';
    document.getElementById('scanNote').value = '';
    renderAll();
    toast(hasAnomaly ? `已登记异常：${parcel.tracking}` : `拆包完成：${parcel.tracking}`);
    triggerBarcodePrint(parcel);
  }

  async function triggerBarcodePrint(parcel) {
    const orderNo = parcel.order || (parcel.jdRepair && parcel.jdRepair.performingOrderNo) || '';
    if (!orderNo) return;
    try {
      const response = await fetch(apiUrl('/api/print'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          orderNo,
          partCode: parcel.partBarcode || '',
          barPrinterPath: localStorage.getItem('jd_bar_printer_path') || ''
        })
      });
      const data = await response.json();
      if (data && data.ok) {
        toast('已触发条码打印');
      } else {
        toast(`条码打印失败：${data.error || data.output || '未知错误'}`, 'error');
      }
    } catch (error) {
      toast('无法调用条码打印软件', 'error');
    }
  }

  function resolveAnomaly(id) {
    const anomaly = state.anomalies.find((a) => a.id === id);
    if (!anomaly) return;
    const tracking = anomaly.tracking;
    state.anomalies = state.anomalies.filter((a) => a.id !== id);
    saveLocalState();
    pushStateToServer(true);
    renderAll();
    toast(`异常已处理：${tracking}`);
  }

  function clearAnomalies() {
    const resolved = state.anomalies.filter((a) => a.status === 'resolved');
    if (!resolved.length) {
      toast('没有已处理的异常记录');
      return;
    }
    if (!confirm(`确定清空 ${resolved.length} 条已处理异常？`)) return;
    state.anomalies = state.anomalies.filter((a) => a.status !== 'resolved');
    saveLocalState();
    pushStateToServer(true);
    renderAll();
    toast('已处理异常已清空');
  }

    renderParcels();
    renderAnomalies();
    renderScan();
  }

  function resetDemo() {
    localStorage.removeItem(STORAGE_KEY);
    state = loadState();
    currentScan = null;
    jdQuerySeq += 1;
    clearTimeout(jdPartBarcodeTimer);
    jdRepairResult = null;
    document.getElementById('trackingInput').value = '';
    document.getElementById('scanNote').value = '';
    document.getElementById('parcelSearch').value = '';
    document.getElementById('parcelStatus').value = 'all';
    document.getElementById('parcelDate').value = '';
    onlyPendingAnomalies = false;
    saveLocalState();
    pushStateToServer(true);
    renderAll();
    toast('数据已重置');
  }

  function clearParcels() {
    if (!state.parcels.length) {
      toast('历史记录已为空');
      return;
    }
    if (!confirm('确定清空全部包裹历史记录？')) return;
    state.parcels = [];
    currentScan = null;
    jdQuerySeq += 1;
    clearTimeout(jdPartBarcodeTimer);
    jdRepairResult = null;
    saveLocalState();
    pushStateToServer(true);
    renderAll();
    toast('包裹历史已清空');
  }

  function batchAssignCopy() {
    const items = state.parcels
      .map((p) => {
        const jd = p.jdRepair || {};
        const model = jd.performingModel || p.performingModel || '';
        const barcode = p.partBarcode || jd.partBarcode || '';
        return { tracking: p.tracking, model, barcode };
      })
      .filter((item) => item.barcode && item.model && item.model !== '维修' && item.model !== '--');

    if (!items.length) {
      toast('没有可复制的备件条码', 'error');
      return;
    }

    const text = items.map((item) => item.barcode).join('\n');
    navigator.clipboard.writeText(text).then(
      () => toast(`已复制 ${items.length} 条非维修备件条码`),
      () => toast('复制失败，请手动复制', 'error')
    );
  }

  async function openCamera() {
    if (!navigator.mediaDevices || !('BarcodeDetector' in window)) {
      toast('当前浏览器不支持摄像头扫码，请手动输入', 'error');
      return;
    }
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    } catch (err) {
      toast('无法访问摄像头', 'error');
      return;
    }
    const body = `
      <div class="camera-wrap">
        <video id="cameraVideo" autoplay playsinline></video>
        <div class="camera-status">正在识别条码，请将条码对准取景框</div>
      </div>
    `;
    openModal('扫码识别', body, '<button class="btn btn-primary" type="button" id="cameraStop">停止识别</button>');
    const video = document.getElementById('cameraVideo');
    video.srcObject = cameraStream;
    await video.play();
    let detector;
    try {
      detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'qr_code'] });
    } catch (err) {
      closeCameraModal();
      toast('无法启动条码识别', 'error');
      return;
    }
    cameraTimer = setInterval(async () => {
      if (!video.videoWidth) return;
      try {
        const codes = await detector.detect(video);
        if (codes.length) {
          const value = codes[0].rawValue;
          closeCameraModal();
          document.getElementById('trackingInput').value = value;
          lookupTracking(value);
        }
      } catch (err) {
        clearInterval(cameraTimer);
        cameraTimer = null;
      }
    }, 700);
    document.getElementById('cameraStop').addEventListener('click', closeCameraModal);
  }

  function closeCameraModal() {
    clearInterval(cameraTimer);
    cameraTimer = null;
    if (cameraStream) {
      cameraStream.getTracks().forEach((track) => track.stop());
      cameraStream = null;
    }
    closeModal();
  }

  function stopCamera() {
    clearInterval(cameraTimer);
    cameraTimer = null;
    if (cameraStream) {
      cameraStream.getTracks().forEach((track) => track.stop());
      cameraStream = null;
    }
  }

  function hydrateIcons() {
    document.querySelectorAll('[data-icon]').forEach((node) => {
      node.innerHTML = icon(node.dataset.icon);
    });
  }

  document.querySelectorAll('.nav-item').forEach((button) => {
    button.addEventListener('click', () => {
      location.hash = button.dataset.view;
      switchView(button.dataset.view);
    });
  });
  document.querySelectorAll('[data-view-link]').forEach((button) => {
    button.addEventListener('click', () => switchView(button.dataset.viewLink));
  });
  document.querySelectorAll('.sample-chip').forEach((button) => {
    button.addEventListener('click', () => {
      document.getElementById('trackingInput').value = button.dataset.tracking;
      lookupTracking(button.dataset.tracking);
    });
  });

  document.getElementById('lookupBtn').addEventListener('click', () => lookupTracking(document.getElementById('trackingInput').value));
  document.getElementById('trackingInput').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') lookupTracking(document.getElementById('trackingInput').value);
  });
  document.getElementById('batchAssignBtnScan').addEventListener('click', batchAssignCopy);
  document.getElementById('confirmBtn').addEventListener('click', () => confirmUnpack(false));
  document.getElementById('anomalyBtn').addEventListener('click', () => confirmUnpack(true));
  document.getElementById('printCurrentBtn').addEventListener('click', () => currentScan && printLabel(currentScan));
  document.getElementById('jdSettingsBtn').addEventListener('click', openJdSettings);

  document.getElementById('parcelSearch').addEventListener('input', renderParcels);
  document.getElementById('parcelStatus').addEventListener('change', renderParcels);
  document.getElementById('parcelDate').addEventListener('change', renderParcels);
  document.getElementById('refreshParcels').addEventListener('click', async () => {
    await refreshSharedState();
    renderParcels();
  });
  document.getElementById('batchAssignBtn').addEventListener('click', batchAssignCopy);
  document.getElementById('clearParcelsBtn').addEventListener('click', clearParcels);

  document.getElementById('parcelTbody').addEventListener('click', (event) => {
    const detailButton = event.target.closest('[data-detail-btn]');
    if (detailButton) {
      openParcelDetail(detailButton.dataset.detailBtn);
      return;
    }
    const row = event.target.closest('tr[data-detail]');
    if (row) openParcelDetail(row.dataset.detail);
  });
  document.getElementById('recentTbody').addEventListener('click', (event) => {
    const row = event.target.closest('tr[data-detail]');
    if (row) openParcelDetail(row.dataset.detail);
  });

  document.getElementById('anomalyToggle').addEventListener('click', () => {
    onlyPendingAnomalies = !onlyPendingAnomalies;
    renderAnomalies();
  });
  document.getElementById('clearAnomaliesBtn').addEventListener('click', clearAnomalies);
  document.getElementById('anomalyTbody').addEventListener('click', (event) => {
    const button = event.target.closest('[data-resolve]');
    if (button) resolveAnomaly(button.dataset.resolve);
  });

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('disclaimerBtn').addEventListener('click', openDisclaimer);
  document.getElementById('modalBackdrop').addEventListener('click', (event) => {
    if (event.target === event.currentTarget) closeModal();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeModal();
  });

  function applyHash() {
    const view = location.hash.slice(1);
    if (['dashboard', 'scan', 'parcels', 'anomalies'].includes(view)) switchView(view);
  }
  window.addEventListener('hashchange', applyHash);

  document.getElementById('loginForm').addEventListener('submit', (event) => {
    event.preventDefault();
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (username === AUTH_USER && password === AUTH_PASS) {
      localStorage.setItem(AUTH_KEY, '1');
      localStorage.removeItem('jd_logged_out');
      document.getElementById('loginPassword').value = '';
      document.getElementById('loginError').textContent = '';
      applyAuthGate();
      refreshSharedState();
    } else {
      document.getElementById('loginError').textContent = '账号或密码错误';
    }
  });
  document.getElementById('loginOverlay').addEventListener('mousemove', (event) => {
    const rect = document.getElementById('loginOverlay').getBoundingClientRect();
    const x = (event.clientX - rect.left) / rect.width - .5;
    const y = (event.clientY - rect.top) / rect.height - .5;
    const shiftX = Math.max(-4, Math.min(4, x * 9));
    const shiftY = Math.max(-3, Math.min(3, y * 6));
    const leftPupil = document.getElementById('mascotPupilL');
    const rightPupil = document.getElementById('mascotPupilR');
    if (leftPupil) leftPupil.setAttribute('cx', 69 + shiftX);
    if (leftPupil) leftPupil.setAttribute('cy', 57 + shiftY);
    if (rightPupil) rightPupil.setAttribute('cx', 105 + shiftX);
    if (rightPupil) rightPupil.setAttribute('cy', 57 + shiftY);
  });
  if (applyAuthGate()) {
    refreshSharedState();
    setInterval(refreshSharedState, 10000);
  }

  hydrateIcons();
  applyHash();
  renderAll();
</script>
</body>
</html>
